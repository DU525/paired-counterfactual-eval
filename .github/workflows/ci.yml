name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Type check
        run: python -m mypy || echo "mypy is advisory at this stage"

      - name: Tests
        run: python -m pytest -v

      - name: End-to-end example (aligned)
        run: python examples/run_toy.py --config configs/toy.yaml --out outputs/ci --assert-verdict

      - name: End-to-end example (ranking limited)
        run: python examples/run_toy.py --config configs/toy_ranking_limited.yaml --out outputs/ci2 --assert-verdict

      - name: Repository hygiene scan
        run: python scripts/scan_repo.py . --max-file-mb 20

      - name: Upload example bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-bundle
          path: outputs/
          retention-days: 7